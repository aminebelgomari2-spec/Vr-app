<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="VR Mobile App avec Hand Tracking">
    <link rel="manifest" href="manifest.json">
    <title>VR Mobile Hand Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        #canvas {
            flex: 1;
            display: block;
        }

        #video {
            display: none;
        }

        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }

        .button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 12px;
            margin: 4px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: block;
            width: 100px;
        }

        .button:active {
            background: #00aa00;
        }

        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            border: 2px solid #00ff00;
            max-width: 150px;
        }

        .status div {
            margin: 3px 0;
        }

        .ok { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }

        .stats {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            border: 2px solid #00ff00;
        }

        .debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            border-radius: 8px;
            font-size: 10px;
            font-family: monospace;
            max-width: 200px;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #666;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button class="button" onclick="toggleCamera()">📷 CAM</button>
        <button class="button" onclick="toggleHands()">🖐️ MAIN</button>
        <button class="button" onclick="toggleGyro()">🎯 GYRO</button>
    </div>

    <div class="status" id="status">
        <div id="cameraStatus" class="warning">📷 OFF</div>
        <div id="gyroStatus" class="warning">🎯 OFF</div>
        <div id="handsStatus" class="warning">🖐️ 0</div>
    </div>

    <div class="stats">
        <div>RotX: <span id="rotX">0</span>°</div>
        <div>RotY: <span id="rotY">0</span>°</div>
        <div>Mains: <span id="handCount">0</span></div>
    </div>

    <div class="debug" id="debug"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let cameraActive = false;
        let gyroActive = false;
        let handsActive = false;
        let rotationX = 0, rotationY = 0;
        let detectedHands = 0;
        let videoStream = null;

        function debug(msg) {
            const debugDiv = document.getElementById('debug');
            const time = new Date().toLocaleTimeString();
            debugDiv.innerHTML = `[${time}] ${msg}<br>` + debugDiv.innerHTML.slice(0, 300);
            console.log(msg);
        }

        // Initialiser Three.js
        function initThree() {
            const canvas = document.getElementById('canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(
                75, 
                canvas.clientWidth / canvas.clientHeight, 
                0.1, 
                1000
            );
            camera.position.z = 5;
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true, 
                alpha: false 
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Ajouter des objets 3D
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00ff00,
                emissive: 0x00ff00,
                emissiveIntensity: 0.3
            });
            
            for (let i = 0; i < 5; i++) {
                const cube = new THREE.Mesh(geometry, material);
                cube.position.x = (i - 2) * 1.5;
                cube.userData.originalRotation = { x: 0, y: 0 };
                scene.add(cube);
            }

            // Lumière
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(5, 5, 5);
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            window.addEventListener('resize', () => {
                camera.aspect = canvas.clientWidth / canvas.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            });

            animate();
            debug('Three.js initialisé');
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotation des objets
            scene.children.forEach(obj => {
                if (obj.isMesh) {
                    obj.rotation.x += rotationX * 0.005;
                    obj.rotation.y += rotationY * 0.005;
                }
            });

            renderer.render(scene, camera);
        }

        // Gyroscope
        function toggleGyro() {
            if (!gyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined') {
                    window.addEventListener('deviceorientation', handleOrientation);
                    gyroActive = true;
                    document.getElementById('gyroStatus').className = 'ok';
                    document.getElementById('gyroStatus').textContent = '🎯 ON';
                    debug('Gyroscope: ON');
                } else {
                    debug('Gyroscope: Non supporté');
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                gyroActive = false;
                document.getElementById('gyroStatus').className = 'warning';
                document.getElementById('gyroStatus').textContent = '🎯 OFF';
                debug('Gyroscope: OFF');
            }
        }

        function handleOrientation(event) {
            rotationX = event.beta || 0;
            rotationY = event.gamma || 0;
            document.getElementById('rotX').textContent = Math.round(rotationX);
            document.getElementById('rotY').textContent = Math.round(rotationY);
        }

        // Caméra
        function toggleCamera() {
            if (!cameraActive) {
                startCamera();
            } else {
                stopCamera();
            }
        }

        async function startCamera() {
            try {
                debug('Demande d\'accès à la caméra...');
                
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };

                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                
                // Attendre que la vidéo soit chargée
                video.onloadedmetadata = () => {
                    video.play().catch(e => debug('Erreur play: ' + e.message));
                };

                cameraActive = true;
                document.getElementById('cameraStatus').className = 'ok';
                document.getElementById('cameraStatus').textContent = '📷 ON';
                debug('Caméra: ON');
                
            } catch (err) {
                debug('Erreur: ' + err.message);
                document.getElementById('cameraStatus').className = 'error';
                document.getElementById('cameraStatus').textContent = '📷 ERR';
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            cameraActive = false;
            handsActive = false;
            document.getElementById('cameraStatus').className = 'warning';
            document.getElementById('cameraStatus').textContent = '📷 OFF';
            document.getElementById('handsStatus').className = 'warning';
            document.getElementById('handsStatus').textContent = '🖐️ 0';
            debug('Caméra: OFF');
        }

        // Hand Tracking simplifié
        function toggleHands() {
            if (!cameraActive) {
                debug('Active la caméra d\'abord !');
                alert('Active la caméra d\'abord !');
                return;
            }
            
            handsActive = !handsActive;
            if (handsActive) {
                document.getElementById('handsStatus').className = 'ok';
                document.getElementById('handsStatus').textContent = '🖐️ 1';
                debug('Hand Tracking: ON');
            } else {
                document.getElementById('handsStatus').className = 'warning';
                document.getElementById('handsStatus').textContent = '🖐️ 0';
                debug('Hand Tracking: OFF');
            }
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => debug('Service Worker: OK'))
                .catch(err => debug('SW Error: ' + err.message));
        }

        // Démarrage
        window.addEventListener('load', () => {
            debug('App démarrée');
            initThree();
        });

        // Permissions
        document.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            debug('Gyroscope permission: OK');
                        }
                    })
                    .catch(console.error);
            }
        });
    </script>
</body>
</html>
