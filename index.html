<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>VR Mobile Hand Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas3d, #canvasHands {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .controls {
            position: fixed;
            top: env(safe-area-inset-top, 10px);
            left: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }

        .button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 14px;
            margin: 4px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            display: block;
            width: 110px;
        }

        .button.active { background: #ff9900; }
        .button:active { background: #00aa00; }

        .status {
            position: fixed;
            top: env(safe-area-inset-top, 10px);
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            border: 2px solid #00ff00;
            z-index: 100;
            max-width: 160px;
        }

        .status div { margin: 3px 0; }
        .ok { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }

        .debug {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 10px);
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px;
            border-radius: 8px;
            font-size: 10px;
            font-family: monospace;
            max-height: 90px;
            overflow-y: auto;
            border: 1px solid #666;
            z-index: 100;
        }
    </style>
</head>
<body>
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="canvas3d"></canvas>
    <canvas id="canvasHands"></canvas>

    <div class="controls">
        <button class="button" id="btnCam" onclick="window.toggleCamera()">📷 CAM</button>
        <button class="button" id="btnHands" onclick="window.toggleHands()">🖐️ MAIN</button>
        <button class="button" id="btnGyro" onclick="window.toggleGyro()">🎯 GYRO</button>
    </div>

    <div class="status">
        <div id="cameraStatus" class="warning">📷 OFF</div>
        <div id="gyroStatus" class="warning">🎯 OFF</div>
        <div id="handsStatus" class="warning">🖐️ 0</div>
        <div id="rotDisplay">X:0 Y:0</div>
    </div>

    <div class="debug" id="debug">Chargement...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

        let scene, camera3d, renderer;
        let cameraActive = false;
        let gyroActive = false;
        let handsActive = false;
        let rotationX = 0, rotationY = 0;
        let videoStream = null;
        let handLoopId = null;
        let handLandmarker = null;
        let handLandmarkerReady = false;

        function debug(msg) {
            const d = document.getElementById('debug');
            const time = new Date().toLocaleTimeString();
            d.innerHTML = `[${time}] ${msg}<br>` + d.innerHTML.slice(0, 600);
            console.log(msg);
        }

        // ---------- THREE.JS ----------
        function initThree() {
            const canvas = document.getElementById('canvas3d');
            const w = window.innerWidth;
            const h = window.innerHeight;

            scene = new THREE.Scene();
            camera3d = new THREE.PerspectiveCamera(75, w / h, 0.1, 1000);
            camera3d.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio);

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.4,
                transparent: true, opacity: 0.75
            });

            for (let i = 0; i < 5; i++) {
                const cube = new THREE.Mesh(geometry, material);
                cube.position.x = (i - 2) * 1.5;
                scene.add(cube);
            }

            const light = new THREE.PointLight(0xffffff, 1.2);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x808080));

            window.addEventListener('resize', onResize);
            onResize();
            animate();
            debug('✅ Three.js prêt');
        }

        function onResize() {
            const w = window.innerWidth, h = window.innerHeight;
            camera3d.aspect = w / h;
            camera3d.updateProjectionMatrix();
            renderer.setSize(w, h);
            const ch = document.getElementById('canvasHands');
            ch.width = w;
            ch.height = h;
        }

        function animate() {
            requestAnimationFrame(animate);
            scene.children.forEach(obj => {
                if (obj.isMesh) {
                    obj.rotation.x += rotationX * 0.003;
                    obj.rotation.y += rotationY * 0.003;
                }
            });
            renderer.render(scene, camera3d);
        }

        // ---------- GYROSCOPE ----------
        function toggleGyro() {
            if (!gyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => state === 'granted' ? enableGyro() : debug('❌ Permission gyro refusée'))
                        .catch(err => debug('❌ Erreur permission gyro: ' + err.message));
                } else if (typeof DeviceOrientationEvent !== 'undefined') {
                    enableGyro();
                } else {
                    debug('❌ Gyroscope non supporté');
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                gyroActive = false;
                setStatus('gyroStatus', 'btnGyro', false, '🎯 OFF');
                debug('Gyroscope: OFF');
            }
        }

        function enableGyro() {
            window.addEventListener('deviceorientation', handleOrientation);
            gyroActive = true;
            setStatus('gyroStatus', 'btnGyro', true, '🎯 ON');
            debug('✅ Gyroscope: ON');
        }

        function handleOrientation(event) {
            rotationX = event.beta || 0;
            rotationY = event.gamma || 0;
            document.getElementById('rotDisplay').textContent =
                `X:${Math.round(rotationX)} Y:${Math.round(rotationY)}`;
        }

        // ---------- CAMERA (arrière + ultra grand-angle) ----------
        async function toggleCamera() {
            if (!cameraActive) await startCamera();
            else stopCamera();
        }

        async function findBestBackCamera() {
            // Il faut d'abord une permission pour voir les vrais noms des caméras
            try {
                const tmp = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                tmp.getTracks().forEach(t => t.stop());
            } catch (e) {
                debug('⚠️ Pré-permission échouée: ' + e.message);
            }

            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoInputs = devices.filter(d => d.kind === 'videoinput');
            debug('Caméras: ' + videoInputs.map(d => d.label || '(sans nom)').join(' | '));

            const keywords = ['ultra wide', 'ultra-wide', 'ultrawide', '0.5x', '0.5', 'back ultra'];
            let best = videoInputs.find(d => keywords.some(k => d.label.toLowerCase().includes(k)));

            if (!best) {
                best = videoInputs.find(d => /back|rear|environment|arrière/i.test(d.label));
            }
            return best;
        }

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                debug('❌ Caméra indisponible (HTTPS requis)');
                alert('La caméra nécessite HTTPS.');
                return;
            }

            try {
                debug('Recherche de la meilleure caméra arrière...');
                const bestCam = await findBestBackCamera();

                let constraints;
                if (bestCam) {
                    constraints = {
                        video: { deviceId: { exact: bestCam.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false
                    };
                    debug('📷 Utilise: ' + (bestCam.label || 'caméra arrière'));
                } else {
                    constraints = {
                        video: { facingMode: { exact: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false
                    };
                    debug('📷 Fallback: caméra arrière générique');
                }

                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                video.style.transform = 'none'; // pas de mirroir sur caméra arrière
                await video.play();

                // Essaye de forcer le zoom au minimum = angle le plus large possible
                const track = videoStream.getVideoTracks()[0];
                if (track.getCapabilities) {
                    const caps = track.getCapabilities();
                    if (caps.zoom) {
                        try {
                            await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
                            debug(`🔍 Zoom réglé au minimum (${caps.zoom.min}) pour le plus grand angle`);
                        } catch (e) {
                            debug('⚠️ Impossible de régler le zoom: ' + e.message);
                        }
                    } else {
                        debug('ℹ️ Cette caméra ne supporte pas le contrôle du zoom via le navigateur');
                    }
                }

                cameraActive = true;
                setStatus('cameraStatus', 'btnCam', true, '📷 ON');
                debug('✅ Caméra active: ' + video.videoWidth + 'x' + video.videoHeight);

                initHandLandmarker();
            } catch (err) {
                debug('❌ Erreur caméra: ' + err.name + ' - ' + err.message);
                setStatus('cameraStatus', 'btnCam', false, '📷 ERR', true);
            }
        }

        function stopCamera() {
            if (videoStream) videoStream.getTracks().forEach(t => t.stop());
            cameraActive = false;
            stopHands();
            setStatus('cameraStatus', 'btnCam', false, '📷 OFF');
            debug('Caméra: OFF');
        }

        // ---------- HAND SKELETON (MediaPipe HandLandmarker) ----------
        async function initHandLandmarker() {
            if (handLandmarkerReady) return;
            try {
                debug('Chargement du modèle de squelette de main...');
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );

                try {
                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 2
                    });
                } catch (gpuErr) {
                    debug('⚠️ GPU indisponible, essai en CPU...');
                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                            delegate: "CPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 2
                    });
                }

                handLandmarkerReady = true;
                debug('✅ Modèle de squelette chargé');
            } catch (err) {
                debug('❌ Erreur chargement modèle: ' + err.message);
            }
        }

        function toggleHands() {
            if (!cameraActive) { alert('Active la caméra d\'abord !'); return; }
            if (!handLandmarkerReady) { debug('⏳ Modèle encore en chargement, patiente...'); return; }
            if (!handsActive) startHands();
            else stopHands();
        }

        function startHands() {
            handsActive = true;
            setStatus('handsStatus', 'btnHands', true, '🖐️ ON');
            debug('✅ Squelette de main: ON');
            handLoop();
        }

        function stopHands() {
            handsActive = false;
            if (handLoopId) cancelAnimationFrame(handLoopId);
            const ctx = document.getElementById('canvasHands').getContext('2d');
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            setStatus('handsStatus', 'btnHands', false, '🖐️ 0');
            debug('Squelette de main: OFF');
        }

        // Connexions du squelette (21 points par main, format MediaPipe)
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],       // pouce
            [0,5],[5,6],[6,7],[7,8],       // index
            [5,9],[9,10],[10,11],[11,12],  // majeur
            [9,13],[13,14],[14,15],[15,16],// annulaire
            [13,17],[17,18],[18,19],[19,20],// auriculaire
            [0,17]                          // paume
        ];

        function mapPoint(nx, ny, video, canvas) {
            // Convertit une coordonnée normalisée (0-1) en tenant compte du object-fit:cover
            const vw = video.videoWidth, vh = video.videoHeight;
            const cw = canvas.width, ch = canvas.height;
            const videoRatio = vw / vh, canvasRatio = cw / ch;
            let scale, offsetX = 0, offsetY = 0;

            if (videoRatio > canvasRatio) {
                scale = ch / vh;
                offsetX = (vw * scale - cw) / 2;
            } else {
                scale = cw / vw;
                offsetY = (vh * scale - ch) / 2;
            }
            return [nx * vw * scale - offsetX, ny * vh * scale - offsetY];
        }

        function handLoop() {
            if (!handsActive) return;

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvasHands');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (video.videoWidth > 0 && handLandmarker) {
                const results = handLandmarker.detectForVideo(video, performance.now());

                if (results.landmarks && results.landmarks.length > 0) {
                    document.getElementById('handsStatus').textContent = `🖐️ ${results.landmarks.length}`;

                    results.landmarks.forEach(hand => {
                        // Dessine les os
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 3;
                        HAND_CONNECTIONS.forEach(([a, b]) => {
                            const [ax, ay] = mapPoint(hand[a].x, hand[a].y, video, canvas);
                            const [bx, by] = mapPoint(hand[b].x, hand[b].y, video, canvas);
                            ctx.beginPath();
                            ctx.moveTo(ax, ay);
                            ctx.lineTo(bx, by);
                            ctx.stroke();
                        });

                        // Dessine les articulations
                        hand.forEach((point, idx) => {
                            const [px, py] = mapPoint(point.x, point.y, video, canvas);
                            ctx.beginPath();
                            ctx.arc(px, py, idx === 0 ? 7 : 5, 0, Math.PI * 2);
                            ctx.fillStyle = idx === 0 ? '#ff9900' : '#00ffff';
                            ctx.fill();
                        });
                    });
                } else {
                    document.getElementById('handsStatus').textContent = '🖐️ recherche...';
                }
            }

            handLoopId = requestAnimationFrame(handLoop);
        }

        // ---------- UTILITAIRE ----------
        function setStatus(elId, btnId, isOn, text, isError) {
            const el = document.getElementById(elId);
            el.className = isError ? 'error' : (isOn ? 'ok' : 'warning');
            el.textContent = text;
            const btn = document.getElementById(btnId);
            if (btn) btn.classList.toggle('active', isOn);
        }

        // Expose au HTML (onclick) car on est en type="module" (scope isolé)
        window.toggleCamera = toggleCamera;
        window.toggleHands = toggleHands;
        window.toggleGyro = toggleGyro;

        // ---------- SERVICE WORKER ----------
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => debug('Service Worker: OK'))
                .catch(err => debug('SW erreur (ignorable): ' + err.message));
        }

        // ---------- DEMARRAGE ----------
        window.addEventListener('load', () => {
            debug('App démarrée. Protocole: ' + location.protocol);
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                debug('⚠️ Pas en HTTPS, la caméra va échouer !');
            }
            initThree();
        });
    </script>
</body>
</html>
